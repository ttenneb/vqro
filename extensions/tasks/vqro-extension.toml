manifest_version = 1
id = "vqro.tasks"
name = "Tasks"
version = "0.1.0"
min_vqro_version = "0.9.0"
platforms = ["linux", "macos", "windows"]

[[cli_commands]]
name = "task"
description = "Inspect and update Tasks"
command = ["python3", "./cli.py", "task"]

[[cli_commands]]
name = "message"
description = "Send and claim durable Tasks messages"
command = ["python3", "./cli.py", "message"]

[[services]]
id = "core"
provides = ["action_invoke", "host_document"]
capabilities = ["action_invoke", "host_document"]
document_source = "agent_activity"
command = ["python3", "provider.py", "--native-attention"]
