[package]
name = "prim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
getrandom = "0.4.3"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
libc = "0.2.191"
socket2 = "0.6.5"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
unicode-width = "0.2.3"
vt100 = "0.18.1"
